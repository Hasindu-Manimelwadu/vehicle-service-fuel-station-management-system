<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | AutoCare'">AutoCare</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<aside th:fragment="sidebar" class="sidebar">
    <a class="brand" th:href="@{/dashboard}"><span class="brand-icon">⛽</span><span><strong>AutoCare</strong><small>Fuel Station</small></span></a>
    <nav class="side-nav">
        <a th:href="@{/dashboard}"><span>⌂</span>Dashboard</a>
        <a th:href="@{/sales}"><span>⛽</span>Fuel Sales</a>
        <a th:href="@{/reports}"><span>▥</span>Reports</a>
    </nav>
    <div class="profile"><span class="avatar">A</span><div><strong>Admin</strong><small>admin@autocare.com</small></div></div>
</aside>
<header th:fragment="topbar" class="topbar">
    <div class="search">⌕ <span>Search anything...</span></div>
    <div class="top-actions"><span class="pill">☾ &nbsp; Dark</span><span class="bell">♧</span></div>
</header>
<div th:fragment="messages" th:if="${success}" class="alert success" th:text="${success}"></div>
</body>
</html>
