# ==============================================================================
# H2 Embedded Profile for Quick Evaluation & Testing
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# ==============================================================================

server.port=8080
spring.application.name=customer-vehicle-management-h2

spring.datasource.url=jdbc:h2:mem:vehicle_management_db;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.show-sql=false
spring.sql.init.mode=never

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.web.resources.static-locations=classpath:/static/
