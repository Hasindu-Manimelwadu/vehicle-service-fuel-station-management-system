# Server Configuration
server.port=8080

# Spring Application Name
spring.application.name=fuel-inventory-service

# Database Configuration (MySQL 8.0)
# Password is read securely from the MYSQL_PASSWORD environment variable
spring.datasource.url=jdbc:mysql://localhost:3306/vehicle_service_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${MYSQL_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JSON Formatting
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Colombo