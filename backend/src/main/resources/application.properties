# ==============================================================================
# Application Configuration: Vehicle Service & Fuel Station Management System
# Module: Customer & Vehicle Management (SLIIT SE2030)
# ==============================================================================

server.port=8080
spring.application.name=customer-vehicle-management

# ------------------------------------------------------------------------------
# MySQL Database Configuration
# NOTE: Update the username and password below to match your local MySQL setup
# ------------------------------------------------------------------------------
spring.datasource.url=jdbc:mysql://localhost:3306/vehicle_management_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# JPA / Hibernate Configuration
# ddl-auto=update ensures entities match database tables automatically
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.sql.init.mode=never

# ------------------------------------------------------------------------------
# Web & Static Content Configuration
# ------------------------------------------------------------------------------
spring.web.resources.static-locations=classpath:/static/
