# Server
server.port=8080

# H2 in-memory database (no installation needed, resets every restart)
spring.datasource.url=jdbc:h2:mem:vehicleservicedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# View the database in browser at http://localhost:8080/h2-console
spring.h2.console.enabled=true

# Automatically create/update tables from the JPA entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- To switch to MySQL later, comment out the H2 lines above and uncomment below ---
