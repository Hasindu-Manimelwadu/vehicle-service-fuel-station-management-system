# =====================================================================
# MySQL profile - activated with SPRING_PROFILES_ACTIVE=mysql
# (docker-compose.yml does this automatically). Everything not listed here
# comes from application.properties.
# =====================================================================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:vsfsms_staff_module}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:staffpass123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# H2 console is not relevant when running on MySQL
spring.h2.console.enabled=false
