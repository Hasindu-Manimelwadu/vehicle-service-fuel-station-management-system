# =====================================================================
# Server
# =====================================================================
server.port=8080

# =====================================================================
# Database: H2 (default) - nothing to install, no MySQL password needed.
# The database is a file stored in your home folder (~/vsfsms/staffdb.mv.db),
# so data survives restarts. Tables are created automatically on startup.
#
# NON_KEYWORDS lets us keep column names like "month" that H2 otherwise
# treats as reserved words.
# =====================================================================
spring.datasource.url=jdbc:h2:file:~/vsfsms/staffdb;NON_KEYWORDS=MONTH,YEAR,DAY,VALUE,KEY;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=staffpass123
spring.datasource.driver-class-name=org.h2.Driver

# ---------------------------------------------------------------------
# H2 Console - open http://localhost:8080/h2-console
#   JDBC URL : jdbc:h2:file:~/vsfsms/staffdb;NON_KEYWORDS=MONTH,YEAR,DAY,VALUE,KEY;AUTO_SERVER=TRUE
#   User     : sa
#   Password : staffpass123
# ---------------------------------------------------------------------
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# =====================================================================
# JPA / Hibernate
# =====================================================================
# 'update' creates/alters tables from the entity classes automatically.
# Sample staff + shifts are inserted on first start (see config/SampleDataLoader).
# Dialect is detected automatically (H2 here, MySQL in the "mysql" profile).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# =====================================================================
# Payroll / overtime rules
# Overtime hours for a month = sum over that month's attendance records of
#   max(0, workingHours - normal hours for that day)
# where "normal hours" = the length of the staff member's scheduled
# (non-cancelled) shifts that day, or standard-daily-hours if no shift is
# scheduled (set use-shift-hours=false to always use standard-daily-hours).
# Overtime pay = overtimeHours x (basicSalary / monthly-hours-divisor) x overtime-multiplier
# Defaults follow the common Sri Lankan (Shop & Office Employees Act)
# convention: 8-hour day, hourly rate = monthly salary / 240, OT at 1.5x.
# Each can be overridden with an environment variable, e.g. PAYROLL_OT_MULTIPLIER=2
# =====================================================================
payroll.standard-daily-hours=${PAYROLL_STANDARD_DAILY_HOURS:8}
payroll.monthly-hours-divisor=${PAYROLL_MONTHLY_HOURS_DIVISOR:240}
payroll.overtime-multiplier=${PAYROLL_OT_MULTIPLIER:1.5}
payroll.use-shift-hours=${PAYROLL_USE_SHIFT_HOURS:true}
