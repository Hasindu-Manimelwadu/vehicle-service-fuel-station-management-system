<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Fuel Sales Dashboard')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container"><div class="header"><div><h1>Fuel Sales & Reporting Dashboard</h1><p>Fuel sales, payment monitoring, invoices and business analytics.</p></div><a class="btn primary" th:href="@{/sales/new}">+ Record Fuel Sale</a></div><div class="stats"><div><span>Paid Revenue</span><b th:text="${'LKR '+#numbers.formatDecimal(paidRevenue,1,2)}"></b></div><div><span>Paid Sales</span><b th:text="${paidCount}"></b></div><div><span>Fuel Sold</span><b th:text="${paidQuantity+' L'}"></b></div><div><span>Total Transactions</span><b th:text="${totalSales}"></b></div></div><div class="grid"><section class="card"><h2>Recent Fuel Sales</h2><table><tr><th>Invoice</th><th>Fuel</th><th>Qty</th><th>Payment</th><th>Total</th></tr><tr th:each="s:${recentSales}"><td><a th:href="@{/sales/{id}/invoice(id=${s.id})}" th:text="${s.invoiceNumber}"></a></td><td th:text="${s.fuelItem.name}"></td><td th:text="${s.quantity+' '+s.fuelItem.unit}"></td><td th:text="${s.paymentMethod+' / '+s.paymentStatus}"></td><td th:text="${'LKR '+#numbers.formatDecimal(s.totalAmount,1,2)}"></td></tr></table></section><section class="card"><h2>Low-stock Alerts</h2><p th:if="${#lists.isEmpty(lowStock)}" class="alert success">No low-stock fuel items.</p><table th:unless="${#lists.isEmpty(lowStock)}"><tr><th>Fuel</th><th>Available</th><th>Reorder</th></tr><tr th:each="i:${lowStock}"><td th:text="${i.name}"></td><td th:text="${i.quantity+' '+i.unit}"></td><td th:text="${i.reorderLevel+' '+i.unit}"></td></tr></table></section></div></main></body></html>
