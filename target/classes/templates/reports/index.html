<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Reports')}"></head><body><nav th:replace="~{fragments :: nav}"></nav><main class="container"><div class="header"><div><h1>Fuel Sales, Payment & Reporting</h1><p>Generate a sales report for a selected date range.</p></div><button class="btn primary" onclick="window.print()">Print Report</button></div><form class="card filters" method="get" th:action="@{/reports}"><label>From<input type="date" name="from" th:value="${from}"></label><label>To<input type="date" name="to" th:value="${to}"></label><button class="btn primary" type="submit">Generate Report</button></form><div class="stats"><div><span>Paid Revenue</span><b th:text="${'LKR '+#numbers.formatDecimal(revenue,1,2)}"></b></div><div><span>Paid Transactions</span><b th:text="${paidCount}"></b></div><div><span>Fuel Sold</span><b th:text="${quantity+' L'}"></b></div><div><span>Transactions</span><b th:text="${#lists.size(sales)}"></b></div></div><div class="grid"><section class="card"><h2>Payment Methods</h2><table><tr><th>Method</th><th>Transactions</th></tr><tr th:each="e:${paymentCounts}"><td th:text="${e.key}"></td><td th:text="${e.value}"></td></tr></table></section><section class="card"><h2>Low-stock Fuel</h2><table><tr><th>Fuel</th><th>Available</th><th>Reorder Level</th></tr><tr th:each="i:${lowStock}"><td th:text="${i.name}"></td><td th:text="${i.quantity+' '+i.unit}"></td><td th:text="${i.reorderLevel+' '+i.unit}"></td></tr></table></section></div><section class="card"><h2>Detailed Sales Report</h2><div class="table-wrap"><table><tr><th>Invoice</th><th>Date</th><th>Fuel</th><th>Qty</th><th>Payment</th><th>Status</th><th>Total</th></tr><tr th:each="s:${sales}"><td th:text="${s.invoiceNumber}"></td><td th:text="${#temporals.format(s.saleDateTime,'dd MMM yyyy HH:mm')}"></td><td th:text="${s.fuelItem.name}"></td><td th:text="${s.quantity+' '+s.fuelItem.unit}"></td><td th:text="${s.paymentMethod}"></td><td th:text="${s.paymentStatus}"></td><td th:text="${'LKR '+#numbers.formatDecimal(s.totalAmount,1,2)}"></td></tr></table></div></section></main></body></html>
